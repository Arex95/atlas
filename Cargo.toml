[workspace]
resolver = "3"
members = [
    "bin/atlas",
    "bin/atlas-server",
    "features/afg",
    "features/auth",
    "features/graph",
    "features/mcp",
    "features/memory",
    "features/messaging",
    "features/notes",
    "features/sessions",
    "features/sync",
    "features/terminal",
    "features/tracker",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Arex95/atlas"
authors = ["Arex95", "Claude"]
# crates.io requires an OSI-approved license, which this deliberately is
# not. Stated here so an accidental `cargo publish` fails at the check
# rather than at the registry.
publish = false

# Zero-warning policy: every clippy lint that surfaces a mistake is denied
# workspace-wide. A crate that needs to opt out states the reason in code
# via `#[allow(...)]` on the smallest scope possible — never here.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that pay their cost only in aesthetics are muted globally.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Release profile: strip symbols, LTO, one codegen unit for smaller and
# faster binaries. The debug profile keeps defaults for fast iteration.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
