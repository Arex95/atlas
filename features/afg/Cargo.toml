[package]
name = "atlas-afg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
atlas-auth = { path = "../auth" }
atlas-messaging = { path = "../messaging" }
atlas-sessions = { path = "../sessions" }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.28", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "sync"] }
ulid = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
