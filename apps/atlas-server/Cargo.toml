[package]
name = "atlas-server"
version = "0.1.0"
edition = "2024"
authors = ["Arex95"]
license = "MIT"
description = "Terminal orchestrator for humans and AI agents"
repository = "https://github.com/Arex95/atlas"

[dependencies]
axum = { version = "0.7.9", features = ["multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socketioxide = "0.18.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "uuid"] }
tokio = { version = "1.52.1", features = ["full"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "request-id", "util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "1.2.1"
futures = "0.3"
garde = { version = "0.21", features = ["derive", "regex"] }
regex = "1.10"
walkdir = "2.4"
mime_guess = "2.0"
